name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    name: Enable auto-merge (base image)
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - id: app-token
        if: steps.meta.outputs.package-ecosystem == 'docker'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      # Only the Chainguard digest bump is auto-merged (ADR0011)
      # pip / actions bumps stay on manual review.
      - name: Enable auto-merge
        if: steps.meta.outputs.package-ecosystem == 'docker'
        run: gh pr merge --auto --squash "$PR_URL" --repo "$GITHUB_REPOSITORY"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}